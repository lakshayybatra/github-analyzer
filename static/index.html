<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Repo Analyzer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
  }

  .header {
    background: linear-gradient(135deg, #161b22 0%, #0d1117 100%);
    border-bottom: 1px solid #30363d;
    padding: 32px 40px;
    text-align: center;
  }
  .header h1 { font-size: 28px; font-weight: 800; color: #58a6ff; }
  .header p  { font-size: 13px; color: #8b949e; margin-top: 6px; }

  .search-bar {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 28px 40px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
  }
  .search-bar input {
    width: 340px;
    padding: 12px 16px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #e6edf3;
    font-size: 15px;
    outline: none;
    transition: border-color .2s;
  }
  .search-bar input:focus { border-color: #58a6ff; }
  .search-bar input::placeholder { color: #484f58; }
  .search-bar button {
    padding: 12px 24px;
    background: #238636;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
  }
  .search-bar button:hover { background: #2ea043; }
  .search-bar button:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }

  /* ── Layout ── */
  .page-layout {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 24px;
    align-items: start;
  }

  .main-content { min-width: 0; }

  /* ── Profile card ── */
  .profile-card {
    display: flex;
    align-items: center;
    gap: 24px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 24px 28px;
    margin-bottom: 20px;
  }
  .profile-card img { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #30363d; }
  .profile-card .name { font-size: 22px; font-weight: 700; color: #e6edf3; }
  .profile-card .login { font-size: 14px; color: #58a6ff; margin-top: 2px; }
  .profile-card .bio { font-size: 13px; color: #8b949e; margin-top: 6px; max-width: 400px; }
  .profile-card .meta { font-size: 13px; color: #8b949e; margin-top: 8px; display: flex; gap: 16px; flex-wrap: wrap; }
  .profile-link {
    margin-left: auto;
    padding: 8px 16px;
    background: transparent;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #58a6ff;
    font-size: 13px;
    text-decoration: none;
    white-space: nowrap;
    transition: border-color .2s;
  }
  .profile-link:hover { border-color: #58a6ff; }

  /* ── Stats ── */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 18px 22px;
    text-align: center;
  }
  .stat-card .val { font-size: 32px; font-weight: 800; color: #58a6ff; }
  .stat-card .lbl { font-size: 12px; color: #8b949e; margin-top: 4px; text-transform: uppercase; letter-spacing: .6px; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }

  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 20px 22px;
  }
  .card h3 { font-size: 13px; font-weight: 700; color: #8b949e; text-transform: uppercase; letter-spacing: .7px; margin-bottom: 14px; }

  .repo-item { padding: 12px 0; border-bottom: 1px solid #21262d; }
  .repo-item:last-child { border-bottom: none; padding-bottom: 0; }
  .repo-item .repo-name { font-size: 14px; font-weight: 600; color: #58a6ff; text-decoration: none; }
  .repo-item .repo-name:hover { text-decoration: underline; }
  .repo-item .repo-desc { font-size: 12px; color: #8b949e; margin-top: 3px; }
  .repo-item .repo-meta { display: flex; gap: 14px; margin-top: 6px; }
  .repo-item .repo-meta span { font-size: 12px; color: #8b949e; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: #21262d; color: #8b949e; }

  .recent-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #21262d; font-size: 13px; }
  .recent-item:last-child { border-bottom: none; }
  .recent-item a { color: #58a6ff; text-decoration: none; }
  .recent-item a:hover { text-decoration: underline; }
  .recent-item .right { display: flex; gap: 10px; align-items: center; color: #8b949e; font-size: 12px; }

  /* ── Chatbot ── */
  .chatbot-panel {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    height: 600px;
    position: sticky;
    top: 20px;
  }
  .chat-header {
    padding: 16px 18px;
    border-bottom: 1px solid #30363d;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .chat-header .dot {
    width: 8px; height: 8px;
    background: #3fb950;
    border-radius: 50%;
  }
  .chat-header span { font-size: 14px; font-weight: 600; color: #e6edf3; }
  .chat-header small { font-size: 12px; color: #8b949e; margin-left: auto; }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: thin;
    scrollbar-color: #30363d transparent;
  }

  .msg {
    max-width: 88%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.5;
  }
  .msg.user {
    background: #1f6feb;
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    background: #21262d;
    color: #e6edf3;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .msg.bot.thinking {
    color: #8b949e;
    font-style: italic;
  }

  .chat-suggestions {
    padding: 0 16px 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .suggestion-btn {
    padding: 5px 10px;
    background: #21262d;
    border: 1px solid #30363d;
    border-radius: 999px;
    color: #8b949e;
    font-size: 11px;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .suggestion-btn:hover { border-color: #58a6ff; color: #58a6ff; }

  .chat-input-row {
    padding: 12px 16px;
    border-top: 1px solid #30363d;
    display: flex;
    gap: 8px;
  }
  .chat-input-row input {
    flex: 1;
    padding: 9px 12px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #e6edf3;
    font-size: 13px;
    outline: none;
    transition: border-color .2s;
  }
  .chat-input-row input:focus { border-color: #58a6ff; }
  .chat-input-row input::placeholder { color: #484f58; }
  .chat-input-row button {
    padding: 9px 14px;
    background: #238636;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: background .2s;
  }
  .chat-input-row button:hover { background: #2ea043; }
  .chat-input-row button:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }

  .chat-locked {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    color: #484f58;
    font-size: 13px;
    text-align: center;
    padding: 20px;
  }
  .chat-locked .lock-icon { font-size: 32px; }

  /* ── States ── */
  .empty { text-align: center; padding: 60px 20px; color: #484f58; }
  .empty .icon { font-size: 48px; margin-bottom: 12px; }
  .error-msg { background: #3d1c1c; border: 1px solid #f85149; border-radius: 8px; padding: 14px 18px; color: #f85149; font-size: 14px; margin-bottom: 20px; }
  .loading { text-align: center; padding: 60px; color: #8b949e; font-size: 15px; }
  .spinner { width: 32px; height: 32px; border: 3px solid #30363d; border-top-color: #58a6ff; border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 900px) {
    .page-layout { grid-template-columns: 1fr; }
    .chatbot-panel { height: 450px; position: static; }
    .grid-2, .stats-row { grid-template-columns: 1fr; }
    .profile-card { flex-wrap: wrap; }
    .search-bar input { width: 200px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>⚡ GitHub Repo Analyzer</h1>
  <p>Explore any GitHub profile — and chat with AI about what you find</p>
</div>

<div class="search-bar">
  <input type="text" id="usernameInput" placeholder="Enter GitHub username:" />
  <button id="analyzeBtn" onclick="analyze()">Analyze</button>
</div>

<div class="page-layout">

  <!-- Left: main content -->
  <div class="main-content">
    <div id="error" style="display:none"></div>
    <div id="loading" style="display:none" class="loading">
      <div class="spinner"></div>Fetching GitHub data...
    </div>
    <div id="results" style="display:none"></div>
    <div id="empty" class="empty">
      <div class="icon">🔍</div>
      <p>Enter a GitHub username above to get started</p>
    </div>
  </div>

  <!-- Right: chatbot -->
  <div class="chatbot-panel">
    <div class="chat-header">
      <div class="dot"></div>
      <span>Ask AI about this profile</span>
      <small id="chatUsername"></small>
    </div>

    <div id="chatBody" class="chat-locked">
      <div class="lock-icon">💬</div>
      <p>Analyze a GitHub profile first,<br>then ask me anything about them.</p>
    </div>

    <div id="chatInputArea" style="display:none">
      <div class="chat-suggestions" id="suggestions"></div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="Ask anything about this user..." />
        <button id="chatSendBtn" onclick="sendChat()">Send</button>
      </div>
    </div>
  </div>

</div>

<script>
  const LANG_COLORS = {
    Python:'#3572A5', JavaScript:'#f1e05a', TypeScript:'#2b7489',
    Java:'#b07219', 'C++':'#f34b7d', C:'#555555', Go:'#00ADD8',
    Rust:'#dea584', Ruby:'#701516', Swift:'#ffac45', Kotlin:'#A97BFF',
    Shell:'#89e051', HTML:'#e34c26', CSS:'#563d7c', Default:'#58a6ff'
  };
  function langColor(lang) { return LANG_COLORS[lang] || LANG_COLORS.Default; }

  // ── State ──────────────────────────────────────────────────────────────────
  let currentUsername = null;
  let githubContext   = null;
  let langChart       = null;

  const SUGGESTIONS = [
    "What's their strongest language?",
    "Which repo should I look at first?",
    "Are they actively coding?",
    "Would they be a good Python hire?",
    "Summarize this profile in 2 sentences.",
  ];

  // ── Search ─────────────────────────────────────────────────────────────────
  document.getElementById('usernameInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') analyze();
  });
  document.getElementById('chatInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendChat();
  });

  async function analyze() {
    const username = document.getElementById('usernameInput').value.trim();
    if (!username) return;

    setState('loading');
    const btn = document.getElementById('analyzeBtn');
    btn.disabled = true; btn.textContent = 'Analyzing...';

    try {
      const [profileRes, reposRes] = await Promise.all([
        fetch(`/api/user/${username}`),
        fetch(`/api/repos/${username}`)
      ]);

      if (!profileRes.ok) {
        const err = await profileRes.json();
        throw new Error(err.detail || 'User not found.');
      }

      const profile = await profileRes.json();
      const repos   = await reposRes.json();

      renderResults(profile, repos);
      setState('results');

      // Unlock chatbot
      currentUsername = username;
      githubContext   = { profile, repos };
      unlockChat(username);

    } catch (err) {
      document.getElementById('error').innerHTML =
        `<div class="error-msg">⚠️ ${err.message}</div>`;
      setState('error');
    } finally {
      btn.disabled = false; btn.textContent = 'Analyze';
    }
  }

  function setState(state) {
    ['empty','loading','results','error'].forEach(id => {
      document.getElementById(id).style.display = 'none';
    });
    if (state === 'error') {
      document.getElementById('error').style.display = 'block';
      document.getElementById('empty').style.display = 'block';
    } else {
      document.getElementById(state).style.display = 'block';
    }
  }

  // ── Chatbot ────────────────────────────────────────────────────────────────

  function unlockChat(username) {
    document.getElementById('chatUsername').textContent = `@${username}`;

    // Replace locked state with messages area
    const body = document.getElementById('chatBody');
    body.className = 'chat-messages';
    body.innerHTML = `<div class="msg bot">Hi! I know everything about <strong>@${username}</strong>'s GitHub. Ask me anything — their top languages, best repos, activity, or whether they'd be a good hire.</div>`;

    // Show suggestions
    const sugg = document.getElementById('suggestions');
    sugg.innerHTML = SUGGESTIONS.map(s =>
      `<button class="suggestion-btn" onclick="useSuggestion('${s}')">${s}</button>`
    ).join('');

    document.getElementById('chatInputArea').style.display = 'block';
  }

  function useSuggestion(text) {
    document.getElementById('chatInput').value = text;
    sendChat();
  }

  async function sendChat() {
    const input = document.getElementById('chatInput');
    const message = input.value.trim();
    if (!message || !currentUsername) return;

    const btn = document.getElementById('chatSendBtn');
    btn.disabled = true;
    input.value = '';

    const body = document.getElementById('chatBody');

    // Add user message
    body.innerHTML += `<div class="msg user">${escHtml(message)}</div>`;

    // Add thinking indicator
    const thinkingId = 'thinking-' + Date.now();
    body.innerHTML += `<div class="msg bot thinking" id="${thinkingId}">Thinking...</div>`;
    body.scrollTop = body.scrollHeight;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message,
          username: currentUsername,
          github_context: githubContext
        })
      });

      const data = await res.json();
      document.getElementById(thinkingId).remove();

      if (!res.ok) throw new Error(data.detail || 'Chat failed.');

      body.innerHTML += `<div class="msg bot">${escHtml(data.reply)}</div>`;

    } catch (err) {
      document.getElementById(thinkingId).remove();
      body.innerHTML += `<div class="msg bot thinking">⚠️ ${err.message}</div>`;
    } finally {
      btn.disabled = false;
      body.scrollTop = body.scrollHeight;
    }
  }

  // ── Render results ─────────────────────────────────────────────────────────

  function renderResults(profile, repos) {
    const joinYear = profile.created_at ? profile.created_at.slice(0,4) : '—';

    document.getElementById('results').innerHTML = `
      <div class="profile-card">
        <img src="${profile.avatar_url}" alt="${profile.login}" />
        <div>
          <div class="name">${profile.name}</div>
          <div class="login">@${profile.login}</div>
          <div class="bio">${profile.bio}</div>
          <div class="meta">
            <span>📍 ${profile.location}</span>
            <span>👥 ${profile.followers} followers · ${profile.following} following</span>
            <span>📅 Joined ${joinYear}</span>
          </div>
        </div>
        <a class="profile-link" href="${profile.html_url}" target="_blank">View on GitHub ↗</a>
      </div>

      <div class="stats-row">
        <div class="stat-card"><div class="val">${repos.totals.repos}</div><div class="lbl">Public Repos</div></div>
        <div class="stat-card"><div class="val">${repos.totals.stars}</div><div class="lbl">Total Stars</div></div>
        <div class="stat-card"><div class="val">${repos.totals.forks}</div><div class="lbl">Total Forks</div></div>
      </div>

      <div class="grid-2">
        <div class="card">
          <h3>⭐ Top Repos by Stars</h3>
          ${repos.top_repos.map(r => `
            <div class="repo-item">
              <a class="repo-name" href="${r.url}" target="_blank">${r.name}</a>
              <div class="repo-desc">${r.description}</div>
              <div class="repo-meta">
                <span>⭐ ${r.stars}</span>
                <span>🍴 ${r.forks}</span>
                ${r.language !== '—' ? `<span class="badge" style="background:${langColor(r.language)}22;color:${langColor(r.language)}">${r.language}</span>` : ''}
                <span>Updated ${r.updated_at}</span>
              </div>
            </div>`).join('') || '<p style="color:#484f58;font-size:13px">No repos found.</p>'}
        </div>

        <div class="card">
          <h3>🧩 Language Breakdown</h3>
          ${repos.language_breakdown.length
            ? `<canvas id="langChart" height="220"></canvas>`
            : '<p style="color:#484f58;font-size:13px">No language data available.</p>'}
        </div>
      </div>

      <div class="card">
        <h3>🕒 Recently Updated</h3>
        ${repos.recent_repos.map(r => `
          <div class="recent-item">
            <a href="${r.url}" target="_blank">${r.name}</a>
            <div class="right">
              ${r.language !== '—' ? `<span class="badge" style="background:${langColor(r.language)}22;color:${langColor(r.language)}">${r.language}</span>` : ''}
              <span>${r.updated_at}</span>
            </div>
          </div>`).join('')}
      </div>`;

    if (repos.language_breakdown.length) {
      if (langChart) langChart.destroy();
      const ctx = document.getElementById('langChart').getContext('2d');
      langChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: repos.language_breakdown.map(l => l.language),
          datasets: [{
            data: repos.language_breakdown.map(l => l.count),
            backgroundColor: repos.language_breakdown.map(l => langColor(l.language)),
            borderColor: '#161b22',
            borderWidth: 3,
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { position: 'right', labels: { color: '#8b949e', font: { size: 12 }, padding: 12 } },
            tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${ctx.parsed} repos (${repos.language_breakdown[ctx.dataIndex].pct}%)` } }
          }
        }
      });
    }
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
